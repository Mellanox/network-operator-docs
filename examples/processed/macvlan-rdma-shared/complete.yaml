apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
  annotations:
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  nicConfigurationOperator:
    operator:
      image: nic-configuration-operator
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"
    configurationDaemon:
      image: nic-configuration-operator-daemon
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"
    logLevel: info
  nvIpam:
    image: nvidia-k8s-ipam
    repository: "nvcr.io/nvidia/mellanox"
    version: "network-operator-v26.10.0"
    imagePullSecrets: []
    enableWebhook: false
  secondaryNetwork:
    cniPlugins:
      image: plugins
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"
    multus:
      image: multus-cni
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"

---
apiVersion: mellanox.com/v1alpha1
kind: NicNodePolicy
metadata:
  name: "poweredge-xe9680-h200"
  annotations:
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  nodeSelector:
    nvidia.com/gpu.product: "NVIDIA-H200"
  ofedDriver:
    image: doca-driver
    repository: "nvcr.io/nvidia/mellanox"
    version: "doca3.6.0-26.10-070000-1"
    env:
      - name: UNLOAD_STORAGE_MODULES
        value: "true"
      - name: ENABLE_NFSRDMA
        value: "false"
      - name: UNLOAD_THIRD_PARTY_RDMA_MODULES
        value: "true"
      - name: SKIP_PREFLIGHT_CHECKS
        value: "false"
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: true
        enable: true
        force: true
        timeoutSeconds: 300
      maxParallelUpgrades: 4
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
  rdmaSharedDevicePlugin:
    image: k8s-rdma-shared-dev-plugin
    repository: "nvcr.io/nvidia/mellanox"
    version: "network-operator-v26.10.0"
    config: |
      {
        "configList": [
          {
            "resourceName": "rdma_shared_resource_rail_0",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["eth2"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_1",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["eth3"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_2",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["eth4"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_3",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["eth5"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_4",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["eth6"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_5",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["eth9"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_6",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["eth10"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_7",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["eth11"]
            }
          }
        ]
      }

