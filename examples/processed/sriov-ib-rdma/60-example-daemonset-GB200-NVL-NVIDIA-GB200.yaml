apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sriov-ib-test-gb200-nvl-nvidia-gb200
  namespace: "default"
  annotations:
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  selector:
    matchLabels:
      app: sriov-ib-test-gb200-nvl-nvidia-gb200
  template:
    metadata:
      labels:
        app: sriov-ib-test-gb200-nvl-nvidia-gb200
      annotations:
        k8s.v1.cni.cncf.io/networks: sriov-network-rail-0-gb200-nvl-nvidia-gb200,sriov-network-rail-1-gb200-nvl-nvidia-gb200,sriov-network-rail-2-gb200-nvl-nvidia-gb200,sriov-network-rail-3-gb200-nvl-nvidia-gb200
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - "NVIDIA-GB200"
      containers:
        - name: test-container
          image: nvcr.io/nvidia/doca/doca:full-rt-cuda13.0.0-3.6.0-runtime-host
          command: ["/bin/bash", "-c", "sleep infinity"]
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          resources:
            requests:
              nvidia.com/sriov_resource_rail_0: '1'
              nvidia.com/sriov_resource_rail_1: '1'
              nvidia.com/sriov_resource_rail_2: '1'
              nvidia.com/sriov_resource_rail_3: '1'
            limits:
              nvidia.com/sriov_resource_rail_0: '1'
              nvidia.com/sriov_resource_rail_1: '1'
              nvidia.com/sriov_resource_rail_2: '1'
              nvidia.com/sriov_resource_rail_3: '1'
        - name: netshoot
          image: nicolaka/netshoot:latest
          command: ["/bin/bash", "-c", "trap 'exit 0' TERM INT; while true; do while wait -n 2>/dev/null; do :; done; sleep 1 & wait $! || true; done"]
          securityContext:
            capabilities:
              add: ["NET_RAW"]
