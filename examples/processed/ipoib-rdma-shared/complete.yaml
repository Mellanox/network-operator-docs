apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
  annotations:
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  nicConfigurationOperator:
    operator:
      image: nic-configuration-operator
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"
    configurationDaemon:
      image: nic-configuration-operator-daemon
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"
    env:
    - name: "FW_RESET_AFTER_CONFIG_UPDATE"
      value: "true"
    logLevel: info
  nvIpam:
    image: nvidia-k8s-ipam
    repository: "nvcr.io/nvidia/mellanox"
    version: "network-operator-v26.10.0"
    imagePullSecrets: []
    enableWebhook: false
  secondaryNetwork:
    cniPlugins:
      image: plugins
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"
    multus:
      image: multus-cni
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"
    ipoib:
      image: ipoib-cni
      repository: "nvcr.io/nvidia/mellanox"
      version: "network-operator-v26.10.0"

---
apiVersion: mellanox.com/v1alpha1
kind: NicNodePolicy
metadata:
  name: "gb200-nvl-nvidia-gb200"
  annotations:
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  nodeSelector:
    nvidia.com/gpu.product: "NVIDIA-GB200"
  ofedDriver:
    image: doca-driver
    repository: "nvcr.io/nvidia/mellanox"
    version: "doca3.6.0-26.10-070000-1"
    env:
      - name: UNLOAD_STORAGE_MODULES
        value: "true"
      - name: ENABLE_NFSRDMA
        value: "false"
      - name: UNLOAD_THIRD_PARTY_RDMA_MODULES
        value: "true"
      - name: SKIP_PREFLIGHT_CHECKS
        value: "false"
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: true
        enable: true
        force: true
        timeoutSeconds: 300
      maxParallelUpgrades: 4
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
  rdmaSharedDevicePlugin:
    image: k8s-rdma-shared-dev-plugin
    repository: "nvcr.io/nvidia/mellanox"
    version: "network-operator-v26.10.0"
    config: |
      {
        "configList": [
          {
            "resourceName": "rdma_shared_resource_rail_0",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["ibp3s0"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_1",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["ibP2p3s0"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_2",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["ibP16p3s0"]
            }
          },
          {
            "resourceName": "rdma_shared_resource_rail_3",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": ["ibP18p3s0"]
            }
          }
        ]
      }

---
apiVersion: nv-ipam.nvidia.com/v1alpha1
kind: IPPool
metadata:
  name: nv-ipam-pool-rail-0-gb200-nvl-nvidia-gb200
  namespace: "nvidia-network-operator"
  annotations:
    nvidia.kubernetes-launch-kit.source-groups: "[\"gb200-nvl-nvidia-gb200\"]"
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  subnet: 192.168.0.0/22
  perNodeBlockSize: 10
  gateway: 192.168.0.1
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
              - "NVIDIA-GB200"
