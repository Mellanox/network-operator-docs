apiVersion: configuration.net.nvidia.com/v1alpha1
kind: NicConfigurationTemplate
metadata:
  name: nic-configuration-gb200-nvl-nvidia-gb200
  namespace: "nvidia-network-operator"
  annotations:
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  nodeSelector:
    nvidia.com/gpu.product: "NVIDIA-GB200"
  nicSelector:
    nicType: "1021"
    pciAddresses: ["0000:03:00.0", "0002:03:00.0", "0010:03:00.0", "0012:03:00.0"]
  resetToDefault: false
  template:
    numVfs: 8
    linkType: Infiniband
    pciPerformanceOptimized:
      enabled: true
      maxReadRequest: 4096
    gpuDirectOptimized:
      enabled: true
      env: Baremetal

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ipoib-test-gb200-nvl-nvidia-gb200
  namespace: "default"
  annotations:
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  selector:
    matchLabels:
      app: ipoib-test-gb200-nvl-nvidia-gb200
  template:
    metadata:
      labels:
        app: ipoib-test-gb200-nvl-nvidia-gb200
      annotations:
        k8s.v1.cni.cncf.io/networks: ipoib-network-rail-0-gb200-nvl-nvidia-gb200,ipoib-network-rail-1-gb200-nvl-nvidia-gb200,ipoib-network-rail-2-gb200-nvl-nvidia-gb200,ipoib-network-rail-3-gb200-nvl-nvidia-gb200
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - "NVIDIA-GB200"
      containers:
        - name: test-container
          image: nvcr.io/nvidia/doca/doca:full-rt-cuda13.0.0-3.6.0-runtime-host
          command: ["/bin/bash", "-c", "sleep infinity"]
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          resources:
            requests:
              rdma/rdma_shared_resource_rail_0: 1
              rdma/rdma_shared_resource_rail_1: 1
              rdma/rdma_shared_resource_rail_2: 1
              rdma/rdma_shared_resource_rail_3: 1
            limits:
              rdma/rdma_shared_resource_rail_0: 1
              rdma/rdma_shared_resource_rail_1: 1
              rdma/rdma_shared_resource_rail_2: 1
              rdma/rdma_shared_resource_rail_3: 1
        - name: netshoot
          image: nicolaka/netshoot:latest
          command: ["/bin/bash", "-c", "trap 'exit 0' TERM INT; while true; do while wait -n 2>/dev/null; do :; done; sleep 1 & wait $! || true; done"]
          securityContext:
            capabilities:
              add: ["NET_RAW"]
