apiVersion: nv-ipam.nvidia.com/v1alpha1
kind: IPPool
metadata:
  name: nv-ipam-pool-rail-0-poweredge-xe9680-h200
  namespace: "nvidia-network-operator"
  annotations:
    nvidia.kubernetes-launch-kit.source-groups: "[\"poweredge-xe9680-h200\"]"
    nvidia.kubernetes-launch-kit.version: "v26.10.0"
spec:
  subnet: 192.168.0.0/22
  perNodeBlockSize: 10
  gateway: 192.168.0.1
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
              - "NVIDIA-H200"
---
