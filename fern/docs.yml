#
# Pages reference shared values with a dollar sign and braces. Fern fills them in from
# docs/common/vars.yml (see `profiles` below), so this directory builds as it is:
# run the Fern CLI from the repository root (make docs-check / docs-preview).

instances:
  - url: nvidia-network-operator.docs.buildwithfern.com/networking/network-operator
    custom-domain: docs.nvidia.com/networking/network-operator
    multi-source: true

title: NVIDIA Network Operator

global-theme: nvidia

navbar-links:
  - type: github
    value: https://github.com/Mellanox/network-operator

logo:
  right-text: Network Operator

redirects: ./redirects.yml

profiles:
  default:
    vars: ../docs/common/vars.yml
  v24_4_0:
    vars: ./vars-v24.4.0.yml
  v26_10_0:
    vars: ./vars-v26.10.0.yml

versions:
  # Fern's production generate step treats a variable reference in this file as an
  # environment variable, so the display name is written out. Update it with each release.
  - display-name: "dev"
    path: ../docs/index.yml
    slug: latest
    availability: beta
    profile: default
  - display-name: "v26.10.0"
    ref: 0079309faed7c24ddae9e673a9416b76412e4835
    slug: v26.10.0
    availability: stable
    profile: v26_10_0
  - display-name: "24.4.0"
    slug: v24.4.0
    ref: 78b7a7c3c0abce048528c27c3ff44a56d9a08bc2
    availability: stable
    profile: v24_4_0
