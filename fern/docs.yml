# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
#
# Pages reference shared values as ${name}. Fern fills them in from
# docs/common/vars.yml (see `profiles` below), so this directory builds as it is:
# run the Fern CLI from the repository root (make docs-check / docs-preview).

instances:
  - url: nvidia-network-operator.docs.buildwithfern.com/networking/nvidia-network-operator
    custom-domain: docs.nvidia.com/networking/nvidia-network-operator
    multi-source: true

title: NVIDIA Network Operator

global-theme: nvidia

navbar-links:
  - type: github
    value: https://github.com/Mellanox/network-operator

logo:
  right-text: Network Operator

redirects: ./redirects.yml

profiles:
  default:
    vars: ../docs/common/vars.yml

versions:
  - display-name: "${network_operator_version}"
    path: ../docs/index.yml
    # Fern does not substitute variables in slugs, so this one is written out.
    slug: "v24.4.0"
    availability: beta
    profile: default
