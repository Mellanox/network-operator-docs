# Publishes the Fern documentation site when a docs tag is pushed or manually triggered.
#
# To publish:  git tag docs/v26.10.0 && git push origin docs/v26.10.0
# Or use the "Run workflow" button in the Actions tab.
#
# Required configuration:
# - Organization secret: FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs

on:
  push:
    tags:
      - 'docs/v*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Fern CLI
        # Unpinned on purpose: the nvidia Fern org enforces the allowed CLI range.
        run: npm install -g fern-api@latest

      - name: Render site
        run: make docs-render

      - name: Publish Docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        working-directory: ./_build/fern/fern
        run: |
          set -eo pipefail
          fern generate --docs 2>&1 | tee /tmp/fern-output.log
          URL=$(grep -oP 'Published docs to \K.*(?= \()' /tmp/fern-output.log || true)
          if [ -n "$URL" ]; then
            echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
